[package]
name = "omatree-editor"
version = "0.1.2"
edition = "2021"
description = "OmaTree's source-backed live Markdown editor for egui, with Markdown, folder, ZIP and PDF export."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dorotabro/OmaTree"
publish = false

[lib]
name = "omatree_editor"
path = "src/lib.rs"

[dependencies]
# The editor library depends on egui only; eframe (window, event loop, backends) belongs to the host application.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
emojis = "0.9.1"
zip = { version = "9.1.0", default-features = false }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }
rustybuzz = "0.20"

[dev-dependencies]
lopdf = "0.46.0"
tempfile = "3"
