[package]
name = "omatree-egui"
version = "0.1.2"
edition = "2021"
description = "OmaTree's egui/eframe application shell (migration ticket E4). No Qt."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dorotabro/OmaTree"
publish = false

[lib]
name = "omatree_egui"
path = "src/lib.rs"

[[bin]]
name = "omatree-egui"
path = "src/main.rs"

[dependencies]
omatree-core = { path = "../core" }
# The editor library lives in its own repository and is pinned to an exact commit (the tip of its
# `editor-library` branch that contains E2, E3 and E3.1). The package keeps the spike's name; its
# library target is `omatree_editor`. To update the pin see docs/EGUI_MIGRATION_PLAN.md,
# "E4.1 implementation record".
omatree_editor = { package = "omatree-egui-editor-spike", git = "https://github.com/Dorotabro/omatree-egui-editor-spike.git", rev = "30a95dd43064232dc1ac04315c8020e2307a223c" }
# Same egui/eframe line and feature set as the editor repository's own binary.
eframe = { version = "0.37", default-features = false, features = ["clipboard", "links", "default_fonts", "system_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
