[package]
name = "omatree"
version = "0.1.0"
edition = "2021"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
